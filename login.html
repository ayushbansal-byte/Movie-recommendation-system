<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Movie Mania</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body data-page="login">
  <header class="topbar">
    <a class="brand" href="index.html">MOVIE <span>MANIA</span></a>
    <a class="text-link" href="index.html">Back</a>
  </header>
  <main class="login-wrap">
    <form id="accountForm" class="login-box">
      <h1 id="formTitle">Sign in</h1>
      <div id="nameField" class="hidden">
        <label for="name">Name</label>
        <input id="name" type="text" placeholder="Your name">
      </div>
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="Email address" required>
      <label for="password">Password</label>
      <div class="pass-wrap">
        <input id="password" type="password" placeholder="Password" required>
        <button type="button" class="pass-toggle" id="passToggle" aria-label="Show password">👁</button>
      </div>
      <div id="strengthBar" class="strength-bar hidden">
        <div class="strength-fill" id="strengthFill"></div>
      </div>
      <ul id="passRules" class="pass-rules hidden">
        <li id="rule-len">At least 8 characters</li>
        <li id="rule-upper">One uppercase letter (A–Z)</li>
        <li id="rule-lower">One lowercase letter (a–z)</li>
        <li id="rule-num">One number (0–9)</li>
        <li id="rule-special">One special character (!@#$…)</li>
      </ul>
      <button id="submitAccount" class="button red" type="submit">Sign in</button>
      <p id="loginMessage" class="note" aria-live="polite"></p>
      <p class="note">This is a browser demo. Use a test password, not one you use elsewhere.</p>
      <p class="switch-text">
        <span id="switchPrompt">New here?</span>
        <button id="switchForm" type="button">Create account</button>
      </p>
    </form>
  </main>
</body>
</html>
